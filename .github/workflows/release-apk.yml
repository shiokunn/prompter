name: release-apk

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PROMPTER_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
      PROMPTER_STORE_PASSWORD: ${{ secrets.PROMPTER_STORE_PASSWORD }}
      PROMPTER_KEY_ALIAS: ${{ secrets.PROMPTER_KEY_ALIAS }}
      PROMPTER_KEY_PASSWORD: ${{ secrets.PROMPTER_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PROMPTER_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 PROMPTER_STORE_PASSWORD PROMPTER_KEY_ALIAS PROMPTER_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret $name is not configured"
              exit 1
            fi
          done
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$PROMPTER_KEYSTORE_PATH"
          chmod 600 "$PROMPTER_KEYSTORE_PATH"

      - name: Run Python and Kotlin tests
        run: |
          python3 -m unittest tools.test_m1 -v
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify package, ABIs, alignment and signature
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          APK="Prompter-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          python3 tools/verify_apk.py "$APK" \
            --package com.prompter.app.release \
            --abis arm64-v8a,x86_64
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "APK_NAME=$APK" >> "$GITHUB_ENV"

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: prompter-release-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "$APK_NAME" \
            --title "Prompter ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
